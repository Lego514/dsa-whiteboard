<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="A whiteboard for data structures and algorithms: drag in arrays, pointers, trees, graphs, heaps, and DP tables, record steps, and trace code line by line." />
    <meta name="theme-color" content="#f3f5f8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>DSA Whiteboard</title>
    <!-- 貼到 LinkedIn、Slack 等地方時的預覽卡片（網址要寫完整的） -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dsaboard.legoli.dev/" />
    <meta property="og:title" content="DSA Whiteboard" />
    <meta property="og:description" content="Explain algorithms step by step: drag in arrays, pointers, trees, graphs and DP tables, play them back, and co-edit live." />
    <meta property="og:image" content="https://dsaboard.legoli.dev/og.png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta property="og:image:alt" content="DSA Whiteboard playing the Reverse Linked List example, with a complexity block and an edge-case note" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // 自己選過深色或淺色就在畫面出來前套上，不會先閃一下系統的顏色
      try {
        var theme = localStorage.getItem('dsa-whiteboard:theme');
        if (theme === 'dark' || theme === 'light') document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/app/main.tsx"></script>
  </body>
</html>
