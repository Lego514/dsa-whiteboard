name: Deploy collab server

# main 的 CI 通過、而且那次合併改到共用房間的伺服器時，部署到 Cloudflare Workers（部署 CI 測過的那個 commit）。
# 部署會讓連著的人斷線重連，所以只改文件或畫面時不部署；手動執行一律部署。
# 需要 repo 的 secrets：CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID；還沒設定就跳過。
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  secrets:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
          # 會影響伺服器的檔案；main 只收 PR 的合併 commit，跟第一個 parent 比就是那個 PR 改了什麼
          SERVER_PATHS: '^(worker/|src/collab/|src/lib/model\.ts$|src/schema\.ts$|src/constants\.ts$|wrangler\.jsonc$|package-lock\.json$|\.github/workflows/worker\.yml$)'
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::notice::還沒設定 CLOUDFLARE_API_TOKEN 和 CLOUDFLARE_ACCOUNT_ID，跳過部署"
          elif [ "$MANUAL" = "true" ] || git diff --name-only HEAD^1 HEAD | grep -qE "$SERVER_PATHS"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::這次沒有改到伺服器，不部署"
          fi

  deploy:
    needs: secrets
    if: needs.secrets.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
