name: Deploy site

# main 有新的 commit 就把獨立的白板網站部署到 GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # 共用房間的伺服器網址（repo 的 variable）；沒設定就不顯示「共用」
      - run: npm run build:app
        env:
          VITE_COLLAB_URL: ${{ vars.COLLAB_URL }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist-app
      - id: deployment
        uses: actions/deploy-pages@v5
